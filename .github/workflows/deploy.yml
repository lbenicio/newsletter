name: Deploy to AWS

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: aws-deploy
    cancel-in-progress: true

env:
    AWS_REGION: sa-east-1
    AWS_STACK_NAME: newsletter
    SITE_URL: https://newsletter.lbenicio.dev/

jobs:
    deploy:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.168.0"
                  extended: true

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.26"
                  cache: false

            - name: Download dependencies
              run: |
                  for attempt in 1 2 3; do
                    echo "Dependency download attempt ${attempt}/3"
                    if GOPROXY=https://proxy.golang.org,direct go mod download && \
                      GOPROXY=https://proxy.golang.org,direct hugo mod get; then
                      exit 0
                    fi
                    sleep 10
                  done
                  exit 1

            - name: Build with Hugo
              run: |
                  cat > /tmp/hugo-dynamic.toml << EOF
                  baseURL = "${SITE_URL}"
                  [params]
                  siteUrl = "${SITE_URL}"
                  EOF

                  hugo --minify --environment production --cleanDestinationDir --config hugo.toml,/tmp/hugo-dynamic.toml --logLevel info

            - name: Obfuscate
              run: GOPROXY=direct go run github.com/lbenicio/aboutme-v2-theme/cmd/obfuscate@main -verbose ./public

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Resolve CloudFormation outputs
              id: stack
              run: |
                  set -euo pipefail

                  outputs="$(aws cloudformation describe-stacks \
                    --stack-name "${AWS_STACK_NAME}" \
                    --query 'Stacks[0].Outputs' \
                    --output json)"
                  bucket="$(jq -r '.[] | select(.OutputKey == "S3BucketName") | .OutputValue' <<< "${outputs}")"
                  distribution_id="$(jq -r '.[] | select(.OutputKey == "CloudFrontDistributionId") | .OutputValue' <<< "${outputs}")"

                  if [ -z "${bucket}" ] || [ "${bucket}" = "None" ]; then
                    echo "CloudFormation stack ${AWS_STACK_NAME} has no S3BucketName output." >&2
                    exit 1
                  fi
                  if [ -z "${distribution_id}" ] || [ "${distribution_id}" = "None" ]; then
                    echo "CloudFormation stack ${AWS_STACK_NAME} has no CloudFrontDistributionId output." >&2
                    exit 1
                  fi

                  printf 'bucket=%s\n' "${bucket}" >> "$GITHUB_OUTPUT"
                  printf 'distribution_id=%s\n' "${distribution_id}" >> "$GITHUB_OUTPUT"

            - name: Sync site to S3
              env:
                  S3_BUCKET: ${{ steps.stack.outputs.bucket }}
              run: aws s3 sync ./public/ "s3://${S3_BUCKET}/" --delete

            - name: Invalidate CloudFront
              env:
                  CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
              run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"

            - name: Write summary
              run: |
                  {
                    echo "## 🚀 Deploy to AWS"
                    echo ""
                    echo "**Site:** ${SITE_URL}"
                    echo "**Stack:** ${AWS_STACK_NAME}"
                    echo "**Commit:** ${{ github.sha }}"
                  } >> "$GITHUB_STEP_SUMMARY"
