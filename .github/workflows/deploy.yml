name: Deploy to Cloudflare Workers

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cloudflare-deploy
    cancel-in-progress: true

env:
    SITE_URL: https://newsletter.lbenicio.dev/

jobs:
    deploy:
        runs-on: ubuntu-24.04
        environment:
            name: production
            url: ${{ env.SITE_URL }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.168.0"
                  extended: true

            - name: Install Dart Sass
              env:
                  DART_SASS_VERSION: 1.108.0
                  DART_SASS_SHA256: e608a6a633af36ab518919b502581d891d50a05e3adf5bd541e977ab6a4a92a1
              run: |
                  curl --fail --silent --show-error --location \
                    "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
                    --output "${RUNNER_TEMP}/dart-sass.tar.gz"
                  echo "${DART_SASS_SHA256}  ${RUNNER_TEMP}/dart-sass.tar.gz" | sha256sum -c -
                  tar -xzf "${RUNNER_TEMP}/dart-sass.tar.gz" -C "${RUNNER_TEMP}"
                  echo "${RUNNER_TEMP}/dart-sass" >> "$GITHUB_PATH"
                  "${RUNNER_TEMP}/dart-sass/sass" --version

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.27.x"
                  cache: false

            - name: Download dependencies
              run: |
                  for attempt in 1 2 3; do
                    echo "Dependency download attempt ${attempt}/3"
                    if GOPROXY=https://proxy.golang.org,direct go mod download && \
                      GOPROXY=https://proxy.golang.org,direct hugo mod get; then
                      exit 0
                    fi
                    sleep 10
                  done
                  exit 1

            - name: Build with Hugo
              run: |
                  cat > /tmp/hugo-dynamic.toml << EOF
                  baseURL = "${SITE_URL}"
                  [params]
                  siteUrl = "${SITE_URL}"
                  EOF

                  hugo --minify --environment production --cleanDestinationDir --config hugo.toml,/tmp/hugo-dynamic.toml --logLevel info

            - name: Obfuscate
              run: GOPROXY=direct go run github.com/lbenicio/theme/cmd/obfuscate@v0.6.0 -verbose ./public

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 24
            - name: Deploy to Cloudflare Workers
              env:
                CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Missing CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; fi
                if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; fi
                npx --yes wrangler@4 deploy --config wrangler.toml
            - name: Write summary
              run: |
                  {
                    echo "## 🚀 Deploy to Cloudflare Workers"
                    echo ""
                    echo "**Site:** ${SITE_URL}"
                    echo "**Commit:** ${{ github.sha }}"
                  } >> "$GITHUB_STEP_SUMMARY"
