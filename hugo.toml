title = "Leonardo Benicio — Newsletter"
theme = "github.com/lbenicio/theme"
baseURL = "/"
version = "2.0.10"
locale = "en-us"
resourceDir = "resources"

[pagination]
pagerSize = 24
path = "page"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
style = "github-dark"
guessSyntax = true

[taxonomies]
tag = "tags"
category = "categories"

[outputFormats.markdown]
mediaType = "text/markdown"
isPlainText = true
permalinkable = true

[outputs]
home = ["HTML", "RSS", "markdown"]
page = ["HTML", "markdown"]
section = ["HTML", "RSS", "JSON", "markdown"]
taxonomy = ["HTML", "RSS", "markdown"]
term = ["HTML", "RSS", "markdown"]
404 = ["HTML", "markdown"]

[sitemap]
changefreq = "daily"
priority = 0.5
filename = "sitemap.xml"

[permalinks]
post = "/post/:year/:month/:day/:slug/"

[params]
author = "Leonardo Benicio"
description = "Subscribe to Leonardo Benicio's newsletter"
showReadingTime = true

# Social handlers
githubHandler = "lbenicio"
linkedinHandler = "leonardo-benicio"
twitterHandler = "lbenicio_"

# Site (overridden by CI via /tmp/hugo-dynamic.toml)
siteUrl = "https://newsletter.lbenicio.dev/"
appMode = "SINGLE"
singleContent = "content/single/newsletter.md"

# Newsletter
newsletterPostUrl = "https://mail.4686189.xyz/subscription/form"
newsletterCheckboxId = "5e6df"
newsletterCheckboxValue = "5e6df944-ee28-4612-a16f-72838fe90224"
newsletterCheckboxName = "l"

# Legal links
privacyUrl = "https://legal.lbenicio.dev/docs/privacy-policy"
termsUrl = "https://legal.lbenicio.dev/docs/terms-of-service"

[services.googleAnalytics]
id = "G-GGWN56N2C4"

[privacy.googleAnalytics]
respectDoNotTrack = true
